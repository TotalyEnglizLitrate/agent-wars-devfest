[project]
name = "agent-wars-devfest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Narendra S", email = "narendra.s1232@gmail.com" },
    { name = "Niranjhan S U", email = "niranjhansu@gmail.com"},
    { name = "Dharaneesh", email = "dharaneesh23110466@snuchennai.edu.in"}
]
requires-python = ">=3.14"
dependencies = [
    "faker>=40.43.0",
    "fastapi>=0.141.1",
    "google-adk>=2.12.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pulp>=4.0.1",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
